name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test_dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust version
        run: |
          rustc --version
          cargo --version
          rustup show
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test

  integration_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The live tests need the API token secret, which GitHub does not expose to
    # PRs from forks — skip there. They still run on push to main and on PRs from
    # branches within this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: Swatinem/rust-cache@v2
      - name: Run live integration tests
        env:
          ENVIO_API_TOKEN: ${{ secrets.ENVIO_API_TOKEN }}
        run: cargo test -p hypersync-client --test api_test -- --ignored

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: Swatinem/rust-cache@v2
      - name: Verify publishable crates package correctly
        run: |
          cargo package -p hypersync-format
          cargo package -p hypersync-schema
          cargo package -p hypersync-net-types
          cargo package -p hypersync-client

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust version
        run: |
          rustc --version
          cargo --version
          rustup show
      - name: Rustfmt
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -Dwarnings

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Run fuzz tests
        run: |
          cd fuzz
          cargo fuzz run format_serde_json -- -max_total_time=5
          # TODO: fix bincode, currently has failing case but not used
          # cargo fuzz run format_serde_bincode -- -max_total_time=5
          cargo fuzz run net_types_serde_capnp -- -max_total_time=5
