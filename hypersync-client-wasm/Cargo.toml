[package]
name = "hypersync-client-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for hypersync client (minimal subset)"
license = "MPL-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }

anyhow = "1"
alloy-dyn-abi = "1.1"
faster-hex = "0.9"
arrow = { workspace = true, features = ["ipc_compression"] }
# We depend on the main client (not net-types directly): the wasm crate is
# now a thin wasm-bindgen wrapper over `hypersync_client::Client`, reusing
# all of its types (Query, ArrowResponse, ClientConfig, retries, rate-limit
# tracking, capnp serialization toggle, etc.).
hypersync-client = { path = "../hypersync-client", version = "1.1.4" }
# `tokio::sync::{mpsc::Receiver, Mutex}` are used to wrap the in-flight
# stream so JS can pull chunks. The `sync` feature is wasm-clean.
tokio = { version = "1", default-features = false, features = ["sync"] }

[features]
default = ["console_error_panic_hook"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
